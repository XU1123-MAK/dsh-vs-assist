name: Release

# Publishes to npm when a version tag is pushed.
#
# Prerequisites (one-time, in the repository settings):
#   1. Create an npm access token with publish rights for this package.
#   2. Add it as a repository secret named NPM_TOKEN.
#
# To cut a release:
#   1. Bump "version" in package.json.
#   2. Commit, then push a matching tag: git tag v0.1.0 && git push origin v0.1.0

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Verify tag matches package.json version
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag $TAG_VERSION does not match package.json version $PKG_VERSION"
            exit 1
          fi
          echo "Tag $TAG_VERSION matches package.json."

      - name: Syntax check JavaScript sources
        run: |
          for f in lib/*.js; do
            node --check "$f"
            echo "ok: $f"
          done

      - name: Verify package contents
        run: npm pack --dry-run

      - name: Publish
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
